<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.watches"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <body>
    <div class="app-shell">
      <main class="page page--watches">
        <header class="page__header">
          <h1 data-i18n="watches.title"></h1>
          <p class="intro" data-i18n="watches.intro"></p>
        </header>

        <div class="home-watch-sort" id="allWatchesSortRow">
          <label for="allWatchesSort" data-i18n="home.sortBy"></label>
          <select id="allWatchesSort">
            <option value="needs-attention-first" data-i18n="home.sortAttentionFirst"></option>
            <option value="updated-first" data-i18n="home.sortUpdatedFirst"></option>
            <option value="most-recent" data-i18n="home.sortMostRecent"></option>
            <option value="oldest-first" data-i18n="home.sortOldestFirst"></option>
          </select>
        </div>
        <section class="watch-list" id="watchList" aria-live="polite"></section>
      </main>

    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
