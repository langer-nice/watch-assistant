<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.home"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <body>
    <div class="app-shell app-shell--home">
      <a
        class="home-introduction-link"
        href="flow-3.html"
        data-intro-replay
        data-i18n-aria-label="home.viewIntroduction"
        data-i18n-title="home.viewIntroduction"
      >
        <span aria-hidden="true">ⓘ</span>
      </a>

      <main class="page page--home">
        <section class="briefing-report" id="homeBriefingReport" aria-labelledby="homeSummaryLabel">
          <header class="briefing-summary__masthead">
            <p data-i18n="home.briefLabel"></p>
            <div class="briefing-summary__masthead-meta">
              <time class="briefing-summary__timestamp" id="homeBriefingDate"></time>
              <button
                class="briefing-summary__generate"
                id="homeGenerateReport"
                type="button"
                data-i18n-aria-label="home.generateReport"
                data-i18n-title="home.generateReport"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
                  <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
                </svg>
              </button>
            </div>
          </header>

          <div class="briefing-summary">
            <h1 class="briefing-summary__greeting" id="homeSummaryLabel"></h1>
            <p class="briefing-summary__total" id="homeCheckedSummary"></p>

            <ul class="briefing-summary__statuses" aria-label="Status overview" data-i18n-aria-label="home.statusOverviewLabel">
              <li>
                <button class="briefing-summary__status briefing-summary__status--action" type="button" data-home-status-target="attention">
                  <span class="briefing-summary__dot" aria-hidden="true"></span>
                  <span><strong id="homeAttentionCount"></strong> <span id="homeAttentionLabel"></span></span>
                </button>
              </li>
              <li>
                <button class="briefing-summary__status briefing-summary__status--update" type="button" data-home-status-target="updated">
                  <span class="briefing-summary__dot" aria-hidden="true"></span>
                  <span><strong id="homeUpdatedCount"></strong> <span id="homeUpdatedLabel"></span></span>
                </button>
              </li>
              <li id="homeNewSummary" hidden>
                <button class="briefing-summary__status briefing-summary__status--new" type="button" data-home-status-target="new">
                  <span class="briefing-summary__dot" aria-hidden="true"></span>
                  <span><strong id="homeNewCount"></strong> <span id="homeNewLabel"></span></span>
                </button>
              </li>
            </ul>
          </div>
        </section>

        <section class="confirmation-banner confirmation-banner--watch-created" id="homeConfirmation" hidden>
          <span class="confirmation-banner__new-badge" id="homeConfirmationBadge" data-i18n="home.newBadge" hidden></span>
          <p class="banner-title" id="homeConfirmationTitle" data-i18n="home.confirmationTitle"></p>
          <p class="banner-watch" id="homeConfirmationCopy" data-i18n="home.confirmationPlaceholder"></p>
          <p class="banner-copy" id="homeConfirmationBody" data-i18n="home.confirmationCopy"></p>
          <div class="banner-actions">
            <a class="banner-link" id="homeConfirmationLink" href="#" data-i18n="home.viewWatch"></a>
            <button class="banner-dismiss" type="button" id="homeConfirmationDismiss" data-i18n="home.dismiss"></button>
          </div>
        </section>

        <section class="home-empty-state" id="homeEmptyState" aria-labelledby="homeEmptyTitle" hidden>
          <h1 id="homeEmptyTitle" data-i18n="home.emptyTitle"></h1>
          <p data-i18n="home.emptyCopy"></p>
          <a class="button button--primary" href="new-watch.html" data-i18n="home.emptyAction"></a>
        </section>

        <section class="home-empty-state home-empty-state--caught-up" id="homeCaughtUpState" aria-live="polite" hidden>
          <h1 data-i18n="home.dashboardUpToDate"></h1>
          <p data-i18n="home.dashboardNoNewUpdates"></p>
          <a class="editorial-link" href="watches.html" data-i18n="home.viewAllWatches"></a>
        </section>

        <section class="briefing-feed" id="homeBriefingFeed" aria-label="Briefing items" data-i18n-aria-label="home.briefingItemsLabel">
          <div id="homeBriefingList"></div>

          <section class="all-quiet" id="homeAllQuiet" aria-labelledby="allQuietTitle" hidden>
            <p class="section-heading" data-i18n="home.everythingLabel"></p>
            <h2 id="allQuietTitle" data-i18n="home.everythingTitle"></h2>
            <p class="all-quiet__summary">
              <span id="homeEverythingChecked"></span>
              <span data-i18n="home.everythingNoChanges"></span>
            </p>
          </section>
        </section>

        <nav class="home-secondary-navigation" aria-label="Prototype previews" data-i18n-aria-label="home.prototypePreviewsLabel">
          <a href="dashboard.html" data-i18n="home.introductionJourneys"></a>
        </nav>
      </main>

      <dialog
        class="home-report-progress"
        id="homeReportProgress"
        aria-modal="true"
        aria-labelledby="homeReportProgressMessage"
      >
        <div class="home-report-progress__content" id="homeReportProgressFocus" tabindex="-1">
          <span class="home-report-progress__spinner" id="homeReportProgressSpinner" aria-hidden="true"></span>
          <svg class="home-report-progress__result-icon home-report-progress__result-icon--success" id="homeReportProgressSuccess" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
            <path d="m5 12.5 4.5 4.5L19 7"></path>
          </svg>
          <svg class="home-report-progress__result-icon home-report-progress__result-icon--error" id="homeReportProgressError" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7.5v6M12 17h.01"></path>
          </svg>
          <p class="home-report-progress__message" id="homeReportProgressMessage" role="status" aria-live="polite" aria-atomic="true" data-i18n="home.reportGenerating"></p>
          <div class="home-report-progress__actions" id="homeReportProgressActions" hidden>
            <button class="button button--primary" id="homeReportProgressRetry" type="button" data-i18n="home.reportTryAgain"></button>
            <button class="button button--secondary" id="homeReportProgressClose" type="button" data-i18n="home.reportClose"></button>
          </div>
        </div>
      </dialog>

    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
